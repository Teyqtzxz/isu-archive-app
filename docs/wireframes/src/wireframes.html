<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISU E-Library Wireframes</title>
<!--
  Low-fidelity wireframes of the ISU Research Study E-Library (deliverable 3).
  One sheet per frame of the clickable Figma prototype (same numbers and names).
  Open this file in a browser to see every sheet; add ?f=13 to see one sheet.
  render.mjs (next to this file) turns every sheet into a PNG and builds the PDF.
  Labels come from the code on main (761e35c, errata #91); data is made up.
-->
<style>
  :root{--ink:#1e1e1e;--mid:#5a5a5a;--mut:#8a8a8a;--line:#9a9a9a;--soft:#cfcfcf;--fill:#e6e6e6;--page:#f3f3f3;--card:#fff;--dark:#3c3c3c;--hdr:#bdbdbd}
  *{box-sizing:border-box}
  body{margin:0;background:#dcdcdc;font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:14px;line-height:1.35}
  .sheet{background:#fff;margin:0 auto 40px;padding:20px 24px 22px;width:max-content}
  .sheet-hd{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
  .sheet-hd .no{font-size:26px;font-weight:800}
  .sheet-hd .nm{font-size:20px;font-weight:700}
  .sheet-hd .meta{margin-left:auto;font-size:12px;color:var(--mid)}
  .sheet.narrowsheet .sheet-hd{flex-wrap:wrap}
  .sheet.narrowsheet .sheet-hd .meta{margin-left:0;flex-basis:100%}
  .frame{position:relative;background:var(--page);border:2px solid var(--ink);overflow:hidden;filter:grayscale(1)}
  .notes{margin-top:12px;font-size:12.5px;color:var(--ink);display:grid;grid-template-columns:110px 1fr;gap:4px 12px;max-width:100%}
  .notes b{font-weight:700}
  .notes .k{color:var(--mid);font-weight:700;text-transform:uppercase;font-size:11px;padding-top:2px}
  /* generic */
  .row{display:flex;align-items:center;gap:10px}
  .col{display:flex;flex-direction:column;gap:10px}
  .grow{flex:1}
  .seal{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid var(--ink);background:var(--fill);font-weight:800;flex:none}
  .ico{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;font-size:13px;line-height:1;flex:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:8px;font-weight:700;font-size:14px;white-space:nowrap}
  .btn.p{background:var(--dark);color:#fff}
  .btn.s{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.l{height:auto;padding:0;text-decoration:underline;font-weight:700}
  .btn.d{background:#fff;border:2px dashed var(--ink);color:var(--ink)}
  .btn.D{background:#000;color:#fff;border:2px solid #000}
  .btn.dis{background:var(--soft);color:#fff}
  .btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
  .btn.full{display:flex;width:100%}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:12px}
  .lbl{font-weight:700;font-size:13px;margin-bottom:5px}
  .req{font-weight:800}
  .tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.04em;border:1px solid var(--line);background:var(--fill);border-radius:4px;padding:1px 4px;vertical-align:middle}
  .tag.auto{border-style:dashed;background:#fff}
  .box{display:flex;align-items:center;gap:8px;min-height:40px;border:1.5px solid var(--line);border-radius:8px;background:#fff;padding:8px 11px;font-size:14px}
  .box .ph{color:var(--mut)}
  .box .suf{margin-left:auto;color:var(--mut);white-space:nowrap}
  .hint{font-size:12px;color:var(--mid);margin-top:5px}
  .fld{margin-bottom:14px}
  .mut{color:var(--mut)} .mid{color:var(--mid)}
  .bars{display:flex;flex-direction:column;gap:7px}
  .bars i{display:block;height:9px;border-radius:5px;background:var(--soft)}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 11px;background:#fff;font-size:13px;white-space:nowrap}
  .chip .n{display:inline-block;min-width:20px;text-align:center;border-radius:999px;background:var(--fill);font-size:11.5px;font-weight:700;padding:1px 5px}
  .chip.y{background:var(--fill);border-color:var(--line)}
  .chip.dash{border-style:dashed}
  .pill{display:inline-block;border:1px solid var(--soft);background:var(--page);border-radius:999px;padding:2px 8px;font-size:11.5px;color:var(--mid);white-space:nowrap}
  .badge-c{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800}
  .cb{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:2px solid var(--ink);border-radius:4px;background:#fff;font-size:12px;font-weight:900;flex:none}
  .cb.on{background:var(--dark);color:#fff;border-color:var(--dark)}
  .hl{background:var(--fill);border-bottom:2px solid var(--ink)}
  .x{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--mid);font-size:10px;margin-left:2px}
  .hr{height:1px;background:var(--soft);margin:14px 0}
  .cap{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--mid);text-transform:uppercase}
  .img{background:linear-gradient(to top right,transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px)),linear-gradient(to bottom right,transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px)),var(--fill);border:1.5px solid var(--line)}
  /* auth pages */
  .stripe{height:6px;background:linear-gradient(90deg,var(--dark) 0 60%,var(--mut) 60% 80%,var(--soft) 80%)}
  .corner{position:absolute;top:18px;right:18px;width:36px;height:36px;border:1.5px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}
  .authwrap{display:flex;flex-direction:column;align-items:center;padding:48px 16px 40px}
  .authcard{width:420px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:28px 30px}
  .authcard h1{font-size:23px;margin:10px 0 4px;text-align:center}
  .authcard h2{font-size:18px;margin:8px 0 6px;text-align:center}
  .ctr{text-align:center}
  .foot{margin-top:18px;font-size:12px;color:var(--mut);text-align:center}
  .info{display:flex;gap:9px;background:var(--fill);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--mid);margin-bottom:16px}
  .badge{width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:24px;margin:6px auto 4px;font-weight:900}
  .badge.ok{background:var(--dark);color:#fff;border-color:var(--dark)}
  .check{display:flex;flex-direction:column;gap:5px;margin:4px 0 16px;font-size:12.5px}
  .check span{display:flex;align-items:center;gap:7px;font-weight:700}
  .check span:before{content:"✓";display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--dark);color:#fff;font-size:10px}
  .asteps{display:flex;align-items:flex-start;justify-content:center;gap:4px;margin:6px 0 14px}
  .astep{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;font-size:11.5px;color:var(--mut)}
  .astep i{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-style:normal;font-weight:800;font-size:12px}
  .astep.cur{color:var(--ink);font-weight:700} .astep.cur i{background:var(--dark);color:#fff;border-color:var(--dark)}
  .astep.done{color:var(--ink)} .astep.done i{background:var(--fill);border-color:var(--ink)}
  .aline{width:26px;height:2px;background:var(--soft);margin-top:12px}
  /* app header */
  .hdr{background:var(--hdr);color:var(--ink);padding:0 28px}
  .hdr .top{height:64px;display:flex;align-items:center;gap:12px}
  .hdr .t1{font-weight:800;font-size:17px}
  .hdr .t2{font-size:12px;color:#333}
  .hbtn{height:34px;min-width:34px;border:1.5px solid #555;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;font-size:13px;font-weight:700;background:rgba(255,255,255,.35)}
  .av{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .tabs{display:flex;gap:26px;height:44px;align-items:stretch}
  .tab{display:flex;align-items:center;gap:6px;font-size:14px;color:#3a3a3a;border-bottom:4px solid transparent}
  .tab.on{font-weight:800;color:#000;border-bottom-color:#000}
  .wrap{width:1200px;margin:0 auto}
  .narrow{width:720px;margin:0 auto}
  /* student */
  .hero{background:#cdcdcd;padding:46px 0 44px;text-align:center}
  .hero h1{margin:0 0 6px;font-size:34px}
  .hero p{margin:0 0 20px;color:#333}
  .heroin{width:640px;margin:0 auto;display:flex;gap:10px}
  .heroin .box{flex:1;background:rgba(255,255,255,.55);border-color:#555}
  .sec{font-size:18px;font-weight:800;margin:26px 0 12px;display:flex;align-items:baseline}
  .sec .lnk{margin-left:auto;font-size:13.5px;text-decoration:underline}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .sc{padding:16px;display:flex;flex-direction:column;gap:6px;font-size:13px}
  .sc .tt{font-weight:800;font-size:15px;line-height:1.3}
  .kws{display:flex;flex-wrap:wrap;gap:5px}
  .barrow{display:grid;grid-template-columns:62px 1fr 26px;align-items:center;gap:10px;font-size:12.5px;padding:3px 0}
  .track{height:10px;border-radius:6px;background:var(--fill);overflow:hidden}
  .track b{display:block;height:100%;background:var(--mut)}
  /* search */
  .shdr .top{gap:10px}
  .sbox{height:46px;border:1.5px solid #555;border-radius:9px;background:rgba(255,255,255,.5);display:flex;align-items:center;gap:10px;padding:0 14px;margin-bottom:14px;font-size:15px}
  .fbar{background:#fff;border-bottom:1.5px solid var(--soft);padding:10px 0}
  .dd{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;background:#fff;font-weight:700}
  .rc{padding:16px 18px;margin-bottom:12px}
  .rc.on{border:3px solid var(--ink)}
  .rc .t{font-weight:800;font-size:15.5px}
  .pct{margin-left:auto;border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px;background:var(--fill)}
  .det{background:var(--page);border-top:1.5px solid var(--soft);margin:14px -18px -16px;padding:16px 18px;border-radius:0 0 11px 11px}
  .dr{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:5px 0;font-size:13px}
  .dr .k{color:var(--mid);font-weight:700}
  /* register */
  .rsteps{display:flex;align-items:center;gap:8px;margin:18px 0}
  .rs{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}
  .rs i{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--soft);font-style:normal;font-weight:800;font-size:12px}
  .rs.cur{color:var(--ink);font-weight:800} .rs.cur i{border-color:var(--ink)}
  .rs.done{color:var(--ink);font-weight:700} .rs.done i{background:var(--dark);border-color:var(--dark);color:#fff}
  .rl{flex:1;height:2px;background:var(--soft)} .rl.done{background:var(--dark)}
  .rcard{padding:22px;border-top:5px solid var(--dark);margin-bottom:16px}
  .ok-bar{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
  .ok-bar .c{width:22px;height:22px;border-radius:50%;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
  .dup{border:3px solid #000;border-radius:12px;padding:14px;margin-bottom:16px;background:repeating-linear-gradient(45deg,#fff 0 8px,#f1f1f1 8px 16px)}
  .area{border:1.5px solid var(--line);border-radius:8px;background:#fff;padding:12px;font-size:13px;line-height:1.5}
  .dis{opacity:.45}
  /* staff */
  .stat{padding:18px;display:flex;gap:14px;align-items:center}
  .stat .sq{width:44px;height:44px;border-radius:10px;background:var(--fill);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px}
  .stat .big{font-size:28px;font-weight:800;line-height:1}
  .vbars{display:flex;align-items:flex-end;gap:12px;height:150px;border-bottom:1.5px solid var(--line);padding:0 6px}
  .vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:11.5px;font-weight:700;height:100%}
  .vb b{display:block;width:70%;background:var(--mut);border-radius:4px 4px 0 0}
  .vlab{display:flex;gap:12px;padding:5px 6px 0;font-size:11px;color:var(--mid)} .vlab span{flex:1;text-align:center}
  table.t{border-collapse:collapse;width:100%;font-size:13px} table.t td,table.t th{border-bottom:1px solid var(--soft);padding:7px 8px;text-align:left}
  /* overlays */
  .dim{position:absolute;inset:0;background:rgba(0,0,0,.42)}
  .dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--ink);border-radius:14px}
  .toast{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;background:#222;color:#fff;border-radius:10px;padding:12px 18px;display:flex;gap:10px;align-items:center;font-weight:700}
  .toast .c{width:22px;height:22px;border-radius:50%;background:#fff;color:#222;display:flex;align-items:center;justify-content:center;font-size:12px}
  .ann{position:absolute;border:2px dashed #000;border-radius:8px}
  .ann span{position:absolute;top:-12px;left:-12px;background:#000;color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:2px 7px;white-space:nowrap}
  /* phone */
  .ph .hdr{padding:0 14px}
  .ph .hdr .top{height:60px;gap:8px}
  .ph .hdr .t1{font-size:13.5px;line-height:1.2}
  .ph .hdr .t2{font-size:10.5px}
  .ph .wrap{width:auto;padding:0 16px}
  .hscroll{display:flex;gap:10px;overflow:hidden}
  @media print{body{background:#fff}.sheet{margin:0;break-after:page}}
</style>
</head>

<div id="out"></div>
<script>
/* ---------- made-up data (docs/mockup/README.md §2, prompt Part B) ---------- */
const S = {
  s1:{c:'CCSICT',full:'College of Computing Studies, Information and Communication Technology',y:2025,t:'A Mobile Application for Monitoring Rice Field Water Levels Using Low-Cost Sensors',a:['Carlo M. Bautista','Andrea L. Villanueva'],adv:'Dr. Ramon T. Agustin',k:['mobile application','water level monitoring','rice farming','IoT sensors'],p:'Oct 3, 2026'},
  s2:{c:'CA',y:2024,t:'Growth Performance of Lowland Rice Varieties Under Alternate Wetting and Drying Irrigation',a:['Maria Teresa D. Galang'],adv:'Prof. Elena S. Domingo',k:['alternate wetting and drying','lowland rice','irrigation','yield'],p:'Sep 15, 2026'},
  s3:{c:'CED',y:2025,t:'Effects of Gamified Quizzes on the Reading Comprehension of Grade 7 Learners',a:['Joanna P. Ramos','Kevin A. Tolentino','Lea C. Mercado'],adv:'Dr. Cecilia R. Navarro',k:['gamification','reading comprehension','grade 7 learners','formative assessment'],p:'Nov 2, 2026'},
  s4:{c:'CON',y:2023,t:'Knowledge and Practices of Mothers on the Home Care of Children with Dengue Fever',a:['Patricia G. Soriano'],adv:'Dr. Liza M. Fernandez',k:['dengue','home care','maternal knowledge','community health'],p:'Aug 20, 2026'},
  s5:{c:'CBAPA',y:2024,t:'Digital Payment Adoption Among Micro Retailers in a Rural Municipality',a:['Mark Anthony R. Pascual','Shiela B. Ocampo'],adv:'Dr. Victor J. Lazaro',k:['digital payments','micro retailers','technology adoption','rural economy'],p:'Oct 21, 2026'},
  s6:{c:'COE',y:2023,t:'Design and Evaluation of a Solar-Powered Dryer for Corn Kernels',a:['Jerome D. Castillo'],adv:'Engr. Noel P. Santiago and Engr. Rina F. Aquino',advs:true,k:['solar dryer','corn drying','renewable energy','post-harvest'],p:'Jul 8, 2026'},
  s7:{c:'IOF',y:2025,t:'Growth of Nile Tilapia Fed with Fermented Azolla Meal',a:['Daniel V. Mendoza'],adv:'Dr. Grace A. Cabrera',k:['Nile tilapia','azolla','fish feed','aquaculture'],p:'Nov 5, 2026'},
  s8:{c:'CCSICT',y:2026,t:'A Mobile Application for Monitoring Water Levels in Rice Fields Using Ultrasonic Sensors',a:['Nicole F. Reyes','Paolo J. Dizon'],adv:'Dr. Ramon T. Agustin',k:['water level monitoring','mobile application','rice farming','IoT sensors','irrigation','smart farming'],p:'Nov 10, 2026'}
};
const COLLEGES = [['CA',1],['CAS',0],['CBAPA',1],['CCJE',0],['CCSICT',1],['CED',1],['COE',1],['COM',0],['CON',1],['CGS',0],['IOF',1],['SVM',0]];
const TOPKW = ['alternate wetting and drying','aquaculture','azolla','community health','corn drying','dengue','digital payments','fish feed','formative assessment','gamification'];
const CITE1 = 'Bautista, C. M., &amp; Villanueva, A. L. (2025). <i>A Mobile Application for Monitoring Rice Field Water Levels Using Low-Cost Sensors</i> [Unpublished research study]. Isabela State University – Echague Campus.';
const CITE2 = 'Galang, M. T. D. (2024). <i>Growth Performance of Lowland Rice Varieties Under Alternate Wetting and Drying Irrigation</i> [Unpublished research study]. Isabela State University – Echague Campus.';
const FOOT = '© 2026 Isabela State University · Echague Campus · Research Department';
const DRIVE_HINT = 'Share it as Isabela State University → Viewer, with download limited to Editors (docs/08 §7b). Students read it in Google\'s viewer; they cannot download it.';

/* ---------- small pieces ---------- */
const authorLine = a => a.length === 1 ? 'Author: ' + a[0] : a.length === 2 ? 'Authors: ' + a.join(', ') : 'Authors: ' + a[0] + ', ' + a[1] + ' +' + (a.length - 2) + ' more';
const advLine = s => (s.advs ? 'Advisers: ' : 'Adviser: ') + s.adv;
const seal = (n = 40) => `<span class="seal" style="width:${n}px;height:${n}px;font-size:${Math.round(n / 3.2)}px">ISU</span>`;
const ico = c => `<span class="ico">${c}</span>`;
const btn = (l, k = 'p', st = '') => `<span class="btn ${k}" style="${st}">${l}</span>`;
const box = (v, o = {}) => `<div class="box" style="${o.h ? 'min-height:' + o.h + 'px;' : ''}${o.st || ''}">${o.icon ? ico(o.icon) : ''}${o.ph ? `<span class="ph">${o.ph}</span>` : v}${o.suffix ? `<span class="suf">${o.suffix}</span>` : ''}${o.eye ? '<span class="suf">👁</span>' : ''}</div>`;
const field = (label, inner, o = {}) => `<div class="fld" style="${o.st || ''}"><div class="lbl">${label}${o.req ? ' <b class="req">*</b>' : ''}${o.pdf ? ' <span class="tag">FROM PDF</span>' : ''}</div>${inner}${o.note ? `<div class="hint">${o.note}</div>` : ''}</div>`;
const bars = (ws, st = '') => `<div class="bars" style="${st}">${ws.map(w => `<i style="width:${w}%"></i>`).join('')}</div>`;
const chip = (t, n, k = '') => `<span class="chip ${k}">${t}${n !== undefined ? `<span class="n">${n}</span>` : ''}</span>`;
const pills = (ks, n = 4) => `<div class="kws">${ks.slice(0, n).map(k => `<span class="pill">${k}</span>`).join('')}</div>`;
const hl = t => `<span class="hl">${t}</span>`;
const ann = (x, y, w, h, label) => `<div class="ann" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><span>${label}</span></div>`;

/* ---------- account (auth) pages ---------- */
const authTop = h => `<div class="ctr">${seal(72)}</div><h1>${h}</h1><div class="ctr" style="font-weight:800;font-size:14px">Isabela State University</div><div class="ctr mid" style="font-size:13px">Echague Campus</div><div class="hr"></div>`;
const linkTop = () => `<div class="ctr">${seal(56)}</div><div class="ctr mid" style="font-weight:700;font-size:12.5px;margin-top:6px">Isabela State University · Echague Campus</div><div class="hr"></div>`;
const authPage = (card, o = {}) => `<div class="stripe"></div><span class="corner">☾</span><div class="authwrap"><div class="authcard">${card}${o.footer !== false ? '<div class="hint ctr" style="margin-top:16px">Use your @isu.edu.ph account. Personal accounts are not accepted.</div>' : ''}</div>${o.footer !== false ? `<div class="foot">${FOOT}</div>` : ''}</div>`;
const CHECK = `<div class="check"><span>At least 8 characters</span><span>An uppercase letter</span><span>A lowercase letter</span><span>A number</span><span>A symbol</span><span>Passwords match</span></div>`;
const asteps = st => { const L = ['Email', 'Check inbox', 'New password']; return `<div class="asteps">${L.map((l, i) => `${i ? '<span class="aline"></span>' : ''}<div class="astep ${st[i]}"><i>${st[i] === 'done' ? '✓' : i + 1}</i>${l}</div>`).join('')}</div>`; };
const userBox = v => box(v ? v : '', { ph: v ? '' : 'juan.delacruz', suffix: '@isu.edu.ph' });
const pwBox = (dots = true) => box(dots ? '••••••••••' : '', { eye: true });

/* ---------- signed-in headers ---------- */
